[project]
name = "xg-cli"
version = "0.1.0"
description = "XG-CLI: a commercial-grade Python Agent CLI"
readme = "XG-docs/ROADMAP.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
xg = "xg.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.hatch.build.targets.wheel]
packages = ["xg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests, run with `uv run pytest -m slow`",
]
