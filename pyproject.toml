[project]
name = "xg-cli"
version = "0.1.0"
description = "XG-CLI: a commercial-grade Python Agent CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0.43",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "textual>=0.70.0",
]

[project.optional-dependencies]
# SmartRouter ML 精判（第 5 期）：仅离线训练/推理需要，主进程不 import，不装不影响
ml = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
]
# SmartRouter 语义精判（第 6 期）：运行时仅 onnxruntime + tokenizers；
# torch/transformers/optimum 只在离线导出脚本 tools/export_bge_onnx.py 中 import
semantic = [
    "onnxruntime>=1.17",
    "tokenizers>=0.15",
    "numpy>=1.26",
    "optimum[onnxruntime]>=1.16",
    "transformers>=4.40",
    "torch>=2.2",
    "safetensors>=0.4",
]

[project.scripts]
xg = "xg.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
]

[tool.hatch.build.targets.wheel]
packages = ["xg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: slow tests, run with `uv run pytest -m slow`",
]
